<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SiteSafe LinkedIn Cover</title>
<style>
  body {
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #0f172a;
  }
  .cover {
    width: 1128px;
    height: 191px;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    display: flex;
    align-items: center;
    justify-content: flex-end;        /* right‑aligned content */
    padding: 0 40px;
    box-sizing: border-box;
    position: relative;
    overflow: hidden;
  }
  /* subtle accent rings – mirrored to the left now */
  .cover::before {
    content: "";
    position: absolute;
    top: -30px;
    left: -60px;                       /* moved to left side */
    width: 280px;
    height: 280px;
    border: 2px solid rgba(14, 165, 233, 0.08);
    border-radius: 50%;
  }
  .cover::after {
    content: "";
    position: absolute;
    bottom: -40px;
    left: 40%;                         /* kept roughly centered */
    width: 180px;
    height: 180px;
    border: 2px solid rgba(14, 165, 233, 0.06);
    border-radius: 50%;
  }
  .content {
    display: flex;
    align-items: center;
    gap: 24px;
    z-index: 1;
  }
  .logo {
    width: 48px;
    height: 48px;
    flex-shrink: 0;
  }
  .text h1 {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -0.3px;
  }
  .text p {
    margin: 4px 0 0;
    font-family: system-ui, sans-serif;
    font-size: 15px;
    color: #38bdf8;   /* sky-400 */
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="cover">
    <div class="content">
      <img class="logo" src="https://sitesafe.thesift.space/favicon.svg" alt="SiteSafe" />
      <div class="text">
        <h1>SiteSafe</h1>
        <p>Smart visitor management for any workplace</p>
      </div>
    </div>
  </div>
</body>
</html>
